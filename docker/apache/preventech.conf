# Reverse proxy preventech.inl.co.id -> container preventech_fe (host port 8099), like docserter.inl.co.id.
# pm-web passes /api and /sanctum on to pm-api inside the Docker network, so one vhost serves the whole app.
# Installed by docker/apache/setup-preventech.sh; the HTTPS vhost and the http -> https redirect are added by
#   sudo certbot --apache -d preventech.inl.co.id
<VirtualHost *:80>
    ServerName preventech.inl.co.id

    ErrorLog  /var/log/httpd/preventech-error.log
    CustomLog /var/log/httpd/preventech-access.log combined

    ProxyRequests     Off
    ProxyPreserveHost On

    # Photo uploads from phones and PDF/Excel exports; pm-api allows 120 s per request
    ProxyTimeout 120

    ProxyPass        / http://127.0.0.1:8099/
    ProxyPassReverse / http://127.0.0.1:8099/

    # Laravel trusts these from the pm-web container (TRUSTED_PROXIES, default: private ranges);
    # mod_proxy adds X-Forwarded-For itself
    RequestHeader set X-Forwarded-Host  "preventech.inl.co.id"
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
